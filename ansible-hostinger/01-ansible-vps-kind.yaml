---
- name: Setup completo do servidor Debian (Versão Organizada)
  hosts: vps_hostinger
  become: yes
  gather_facts: true
  collections:
    - community.general

  ###################################################################
  # Handlers: São definidos primeiro, mas executados quando notificados
  ###################################################################
  handlers:
    - name: Reiniciar SSH
      service:
        name: sshd
        state: restarted

  ###################################################################
  # Tasks: O fluxo principal de execução
  ###################################################################
  tasks:
    ###################################################################
    # Passo 1: Configuração Base do Sistema Operacional
    ###################################################################
    - name: 1.1 - Atualiza cache e realiza upgrade de pacotes
      apt:
        update_cache: yes
        upgrade: dist

    - name: 1.2 - Instala pacotes essenciais e de utilidade
      apt:
        name:
          # Essenciais
          - git
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
          - rsync
          - bash-completion
          - openssh-client
          # Python
          - python3
          - python3-pip
          - python3-kubernetes  # Importante para módulos Ansible K8s
          # Monitoramento e Utilidades
          - htop
          - btop
          - ncdu
          - duf
          - mlocate
          # Segurança
          - ufw
          - fail2ban
          # Runtime
          - docker.io
        state: present
        update_cache: yes

    - name: 1.3 - Garante que o serviço Fail2Ban está ativo e habilitado
      service:
        name: fail2ban
        state: started
        enabled: yes

    - name: 1.4 - Garante que o diretório de chaves apt exista
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    ###################################################################
    # Passo 2: Hardening de Segurança (Usuário, SSH e Firewall)
    ###################################################################
    - name: 2.1 - Cria o usuário administrador com privilégios sudo
      user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

    - name: 2.2 - Configura sudo sem senha para o usuário administrador
      copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
        owner: root
        group: root
        validate: 'visudo -cf %s'

    - name: 2.3 - Configura a chave SSH para acesso sem senha ao novo usuário
      authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ ssh_public_key }}"

    - name: 2.4 - Aplica template de configuração segura para o SSHD
      template:
        src: "{{ playbook_dir }}/vps-templates-base/sshd_config.j2"
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'
        validate: 'sshd -t -f %s'
      notify: Reiniciar SSH # Notifica o handler para reiniciar o SSH

    - name: 2.5 - Força a execução de handlers (Reinicia o SSH agora)
      meta: flush_handlers

    - name: 2.6 - Libera a nova porta SSH (customizada) no UFW
      community.general.ufw:
        rule: allow
        port: "{{ new_ssh_port }}"
        proto: tcp

    - name: 2.7 - Libera portas 80 (HTTP) apenas para IPs da Cloudflare
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
        port: "80"
        proto: tcp
      loop:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

    - name: 2.8 - Libera portas 443 (HTTPS) apenas para IPs da Cloudflare
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
        port: "443"
        proto: tcp
      loop:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

    - name: 2.9 - Habilita o Firewall (UFW) com política de negação padrão
      community.general.ufw:
        state: enabled
        policy: deny

    ###################################################################
    # Passo 3: Instalação de Runtimes (Docker)
    ###################################################################
    - name: 3.1 - Habilita e inicia serviço Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: 3.2 - Instala Docker Compose (binário oficial)
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_system|lower }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    ###################################################################
    # Passo 4: Instalação de Ferramentas K8s (kubectl, Kind, Helm)
    ###################################################################
    - name: 4.1 - Baixa a chave GPG do repositório K8s
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc

    - name: 4.2 - Configura repositório do Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present

    - name: 4.3 - Instala kubectl
      apt:
        name: kubectl
        state: present
        update_cache: yes

    - name: 4.4 - Seleciona binário do KIND de acordo com a arquitetura
      set_fact:
        kind_download_url: >-
          https://kind.sigs.k8s.io/dl/{{ kind_version }}/{{ (kind_binary_x86_64 if ansible_architecture == 'x86_64' else kind_binary_arm64) }}

    - name: 4.5 - Baixa binário do KIND
      get_url:
        url: "{{ kind_download_url }}"
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: 4.6 - Baixa a chave GPG do repositório Helm (Buildkite)
      ansible.builtin.get_url:
        url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
        dest: /usr/share/keyrings/helm-buildkite-key.asc
        mode: '0644'
        force: true

    - name: 4.7 - Adiciona o repositório Helm (Buildkite)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/helm-buildkite-key.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
        state: present

    - name: 4.8 - Instala Helm via apt (método oficial)
      ansible.builtin.apt:
        name: helm
        state: present
        update_cache: yes

    - name: 4.9 - Baixa binário kubeseal v0.29.0
      get_url:
        url: https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.29.0/kubeseal-0.29.0-linux-amd64.tar.gz
        dest: /tmp/kubeseal.tar.gz

    - name: 4.10 - Extrai binário kubeseal
      shell: tar -xvzf /tmp/kubeseal.tar.gz kubeseal
      args:
        chdir: /tmp
        creates: /tmp/kubeseal # Evita re-extração

    - name: 4.11 - Move kubeseal para /usr/local/bin
      copy:
        src: /tmp/kubeseal
        dest: /usr/local/bin/kubeseal
        mode: '0755'
        remote_src: yes

    ###################################################################
    # Passo 5: Criação do Cluster Kubernetes (Kind)
    ###################################################################
    - name: 5.1 - Verifica se já existe algum cluster KIND
      command: kind get clusters
      register: clusters_list
      changed_when: false
      ignore_errors: true

    - name: 5.2 - Copia o kind-config.yaml para a VPS
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/kind-config.yaml"
        dest: /root/kind-config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: 5.3 - Cria o cluster KIND (se não existir)
      command: kind create cluster --config=/root/kind-config.yaml
      when: "'kind' not in clusters_list.stdout"

    - name: 5.4 - Garante que o diretório .kube existe para o usuário admin
      file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0755'

    - name: 5.5 - Copia o kubeconfig do root para o usuário admin
      copy:
        src: /root/.kube/config
        dest: "/home/{{ admin_user }}/.kube/config"
        remote_src: yes
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0600'
      # Esta tarefa garante que o admin_user possa usar kubectl ao logar

    ###################################################################
    # Passo 6: Instalação de Serviços Core do Cluster (Helm & Manifests)
    ###################################################################
    - name: 6.1 - Adiciona o repositório Helm do Ingress-NGINX
      community.kubernetes.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: 6.2 - Instala o Ingress NGINX via Helm
      community.kubernetes.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: yes
        values:
          controller:
            extraArgs:
              default-ssl-certificate: "ingress-nginx/wildcard-devops-master-shop-tls"
            watchIngressWithoutClass: true
          ingressClassResource:
            name: nginx
            enabled: true
            default: true

    - name: 6.3 - Aguarda o Ingress NGINX ficar pronto
      ansible.builtin.command: >
        kubectl rollout status deployment/ingress-nginx-controller
        --namespace=ingress-nginx --timeout=5m
      changed_when: false

    - name: 6.4 - Baixa manifest oficial do metrics-server
      get_url:
        url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        dest: /root/metrics-server.yaml
        mode: '0644'

    - name: 6.5 - Aplica manifest do metrics-server
      community.kubernetes.k8s:
        state: present
        src: /root/metrics-server.yaml

    - name: 6.6 - Verifica se a flag --kubelet-insecure-tls já existe
      community.kubernetes.k8s_info:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
      register: metrics_server_deployment

    - name: 6.7 - Adiciona flag --kubelet-insecure-tls (patch)
      community.kubernetes.k8s_json_patch:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        patch:
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --kubelet-insecure-tls
      when: "'--kubelet-insecure-tls' not in metrics_server_deployment.resources[0].spec.template.spec.containers[0].args | default([])"

    - name: 6.8 - Aguarda o rollout do metrics-server
      community.kubernetes.k8s:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        wait: yes
        wait_timeout: 180
        wait_condition:
          type: Available
          status: "True"

    ###################################################################
    # Passo 7: Configurações Finais e Debug
    ###################################################################
    - name: 7.1 - Define MOTD personalizado
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/motd"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'

    - name: 7.2 - Configura ~/.bashrc personalizado (root)
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/bashrc"
        dest: /root/.bashrc
        owner: root
        group: root
        mode: '0644'

    - name: 7.3 - Garante que a pasta /root/helm-charts existe
      file:
        path: /root/helm-charts
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: 7.4 - Debug - Versão do KIND
      command: kind version
      register: kind_version_out
      ignore_errors: true
      changed_when: false

    - name: 7.5 - Debug - Versão do kubectl
      command: kubectl version --client
      register: kubectl_version_out
      ignore_errors: true
      changed_when: false

    - name: 7.6 - Debug - Versão do kubeseal
      command: kubeseal --version
      register: kubeseal_version_out
      ignore_errors: true
      changed_when: false

    - name: 7.7 - Exibe status final da configuração
      debug:
        msg:
          - "✅ VPS provisionada, segura e com cluster KIND inicializado com sucesso."
          - "KIND: {{ kind_version_out.stdout | default('Não foi possível obter') }}"
          - "kubectl: {{ kubectl_version_out.stdout | default('Não foi possível obter') }}"
          - "kubeseal: {{ kubeseal_version_out.stdout | default('Não foi possível obter') }}"