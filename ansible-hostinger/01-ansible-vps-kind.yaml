---
- name: Setup completo do servidor Debian
  hosts: vps_hostinger
  become: yes
  gather_facts: true
  collections:
    - community.general

  vars:
    # Define a versão do Helm a ser instalada
    helm_version: "v3.15.0"

  tasks:
    ###################################################################
    # Passo 1: Setup inicial (apt upgrade, pacotes, Docker, etc.)
    ###################################################################
    - name: Atualiza cache e realiza upgrade de pacotes
      apt:
        update_cache: yes
        upgrade: dist

    - name: Instala pacotes essenciais e de rede segura
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Atualiza cache e realiza upgrade de pacotes
      apt:
        update_cache: yes
        upgrade: dist

    - name: Instala pacotes essenciais e de segurança
      apt:
        name:
          - git
          - docker.io
          - python3
          - python3-pip
          - htop
          - ncdu
          - duf
          - btop
          - mlocate
          - bash-completion
          - openssh-client
          - ufw
          - fail2ban
          - rsync
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    ###################################################################
    # Passo 1.5: Hardening de Segurança (Usuário, SSH, Firewall)
    ###################################################################
    - name: Cria o usuário administrador com privilégios sudo
      user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

    - name: Configura sudo sem senha para o usuário administrador
      copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
        owner: root
        group: root
        validate: 'visudo -cf %s'

    - name: Configura a chave SSH para acesso sem senha ao novo usuário
      authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ ssh_public_key }}"

    - name: Aplica template de configuração segura para o SSHd
      template:
        src: "{{ playbook_dir }}/vps-templates-base/sshd_config.j2"
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'
        validate: 'sshd -t -f %s'
      notify: Reiniciar SSH

    - name: Garante que o serviço Fail2Ban está ativo e habilitado
      service:
        name: fail2ban
        state: started
        enabled: yes

    - name: Configura o Firewall (UFW) para negar tudo por padrão
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Libera a nova porta SSH (customizada) para qualquer IP
      community.general.ufw:
        rule: allow
        port: "{{ new_ssh_port }}"
        proto: tcp
    ## CLOUDFLARE ##    
    - name: Libera portas 80 apenas para IPs da Cloudflare
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
        port: "80"
        proto: tcp
      loop:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

    - name: Libera portas 443 apenas para IPs da Cloudflare
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
        port: "443"
        proto: tcp
      loop:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

    # Se precisar liberar alguma porta interna do cluster, adicione regras específicas só para a rede interna!


    ###################################################################
    # O restante do seu playbook original continua aqui
    ###################################################################
    - name: Instala a biblioteca Python do Kubernetes via apt (para contornar PEP 668)
      apt:
        name: python3-kubernetes
        state: present

    - name: Habilita e inicia serviço Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Instala Docker Compose (binário oficial)
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_system|lower }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Define MOTD personalizado
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/motd"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'

    - name: Configura ~/.bashrc personalizado (root)
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/bashrc"
        dest: /root/.bashrc
        owner: root
        group: root
        mode: '0644'

    - name: Seleciona binário do KIND de acordo com a arquitetura
      set_fact:
        kind_download_url: >-
          https://kind.sigs.k8s.io/dl/{{ kind_version }}/{{ (kind_binary_x86_64 if ansible_architecture == 'x86_64' else kind_binary_arm64) }}

    - name: Baixa binário do KIND
      get_url:
        url: "{{ kind_download_url }}"
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: Exibe versão do KIND
      command: kind version
      register: kind_version_out
      ignore_errors: true

    - name: Debug - Versão do KIND
      debug:
        msg: "Versão do KIND: {{ kind_version_out.stdout | default('Não foi possível obter') }}"

    - name: Garante que o diretório de chaves apt exista
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixa a chave GPG do repositório K8s
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc

    - name: Configura repositório do Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present

    - name: Instala kubectl
      apt:
        name: kubectl
        state: present
        update_cache: yes

    - name: Exibe versão do kubectl (cliente)
      command: kubectl version --client
      register: kubectl_version_out
      ignore_errors: true

    - name: Debug - Versão do kubectl
      debug:
        msg: "kubectl: {{ kubectl_version_out.stdout | default('Não foi possível obter') }}"

    - name: Verifica se já existe algum cluster KIND
      command: kind get clusters
      register: clusters_list
      changed_when: false
      ignore_errors: true

    - name: Copia o kind-config.yaml para a VPS
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/kind-config.yaml"
        dest: /root/kind-config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: Cria o cluster KIND com portas 80, 443 e 6443->42885 (se não existir)
      command: kind create cluster --config=/root/kind-config.yaml
      when: "'kind' not in clusters_list.stdout"

    - name: Baixa a chave GPG do repositório Helm (Buildkite)
      ansible.builtin.get_url:
        url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
        dest: /usr/share/keyrings/helm-buildkite-key.asc
        mode: '0644'
        force: true

    - name: Adiciona o repositório Helm (Buildkite)
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/helm-buildkite-key.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
        state: present

    - name: Instala Helm via apt (método oficial)
      ansible.builtin.apt:
        name: helm
        state: present
        update_cache: yes

    - name: Adiciona o repositório Helm do Ingress-NGINX
      community.kubernetes.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: Instala o Ingress NGINX via Helm com certificado padrão
      community.kubernetes.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        release_namespace: ingress-nginx
        create_namespace: yes
        values:
          controller:
            extraArgs:
              # Define o secret padrão para TLS
              default-ssl-certificate: "ingress-nginx/wildcard-devops-master-shop-tls"
            # Permite que o Ingress Controller gerencie Ingresses sem uma IngressClass definida
            watchIngressWithoutClass: true
          # Garante que o IngressClass seja criado e marcado como padrão
          ingressClassResource:
            name: nginx
            enabled: true
            default: true

    - name: Aguarda o Ingress NGINX ficar pronto
      ansible.builtin.command: >
        kubectl rollout status deployment/ingress-nginx-controller
        --namespace=ingress-nginx --timeout=5m
      changed_when: false
            
    - name: Garante que a pasta /root/helm-charts existe no servidor
      file:
        path: /root/helm-charts
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Baixa kubeseal v0.29.0 tar.gz
      get_url:
        url: https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.29.0/kubeseal-0.29.0-linux-amd64.tar.gz
        dest: /tmp/kubeseal.tar.gz

    - name: Extrai binário kubeseal do tar.gz
      shell: tar -xvzf /tmp/kubeseal.tar.gz kubeseal
      args:
        chdir: /tmp
        creates: /tmp/kubeseal

    - name: Move kubeseal para /usr/local/bin
      copy:
        src: /tmp/kubeseal
        dest: /usr/local/bin/kubeseal
        mode: '0755'
        remote_src: yes

    - name: Verifica versão do kubeseal
      command: kubeseal --version
      register: kubeseal_version_out
      ignore_errors: true

    - name: Debug - Versão do kubeseal
      debug:
        msg: "kubeseal instalado: {{ kubeseal_version_out.stdout | default('Não foi possível obter a versão') }}"

    - name: Baixa manifest oficial do metrics-server
      get_url:
        url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        dest: /root/metrics-server.yaml
        mode: '0644'

    - name: Aplica manifest do metrics-server
      community.kubernetes.k8s:
        state: present
        src: /root/metrics-server.yaml

    - name: Verifica se a flag --kubelet-insecure-tls já existe no deployment
      community.kubernetes.k8s_info:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
      register: metrics_server_deployment

    - name: Adiciona flag --kubelet-insecure-tls se não existir (patch)
      community.kubernetes.k8s_json_patch:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        patch:
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --kubelet-insecure-tls
      when: "'--kubelet-insecure-tls' not in metrics_server_deployment.resources[0].spec.template.spec.containers[0].args | default([])"

    - name: Aguarda o rollout do metrics-server
      community.kubernetes.k8s:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        wait: yes
        wait_timeout: 180
        wait_condition:
          type: Available
          status: "True"

    ###################################################################
    ### INÍCIO DA SEÇÃO ADICIONADA PARA CORRIGIR PERMISSÕES         ###
    ###################################################################
    - name: Garante que o diretório .kube existe para o usuário admin
      file:
        path: "/home/{{ admin_user }}/.kube"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0755'

    - name: Copia o kubeconfig do root para o diretório do usuário admin
      copy:
        src: /root/.kube/config
        dest: "/home/{{ admin_user }}/.kube/config"
        remote_src: yes
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0600'
    ###################################################################
    ### FIM DA SEÇÃO ADICIONADA                                     ###
    ###################################################################

    - name: Exibe status final da configuração
      debug:
        msg: "✅ VPS provisionada, segura e com cluster KIND inicializado com sucesso."

  ###################################################################
  # Handlers: Tarefas que são executadas apenas quando notificadas
  ###################################################################
  handlers:
    - name: Reiniciar SSH
      service:
        name: sshd
        state: restarted