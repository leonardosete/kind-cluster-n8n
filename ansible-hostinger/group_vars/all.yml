## [Configurações Gerais da VPS]
# Email para referência ou certificados futuros
ssh_email: "leonardosete@gmail.com"
# Porta que seu cluster Kubernetes irá expor
clusterPort: 42885

# --- VARIÁVEIS DE SEGURANÇA (PREENCHA AQUI) ---

# 1. Defina o nome do usuário que você usará para acessar o servidor via SSH.
#    NÃO use 'root'. Escolha um nome de usuário, por exemplo: "leonardo".
admin_user: "leosete"

# 2. Defina a nova porta que será usada para o acesso SSH.
#    Escolha um número entre 1025 e 65535. Ex: 2222, 4848, etc.
new_ssh_port: 63715

# 3. Cole aqui o CONTEÚDO COMPLETO da sua chave SSH PÚBLICA.
#    Você pode obtê-la no seu computador com o comando: cat ~/.ssh/id_rsa.pub
ssh_public_key: "ssh-rsa  leonardosete@gmail.com"
