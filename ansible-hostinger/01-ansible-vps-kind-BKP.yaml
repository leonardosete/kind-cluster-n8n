# Arquivo: 01-ansible-vps-kind.yaml
---
- name: Setup completo do servidor Debian
  hosts: vps_hostinger
  become: yes
  gather_facts: true
  collections:
    - community.general

  tasks:
    ###################################################################
    # Passo 1: Setup inicial (apt upgrade, pacotes, Docker, etc.)
    ###################################################################
    - name: Atualiza cache e realiza upgrade de pacotes
      apt:
        update_cache: yes
        upgrade: dist

    - name: Instala pacotes essenciais e de segurança
      apt:
        name:
          - git
          - docker.io
          - python3
          - python3-pip
          - htop
          - ncdu
          - duf
          - btop
          - mlocate
          - bash-completion
          - openssh-client
          - ufw
          - fail2ban
          - rsync
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    ###################################################################
    # Passo 1.5: Hardening de Segurança (Usuário, SSH, Firewall)
    ###################################################################
    - name: Cria o usuário administrador com privilégios sudo
      user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

    - name: Configura sudo sem senha para o usuário administrador
      copy:
        dest: "/etc/sudoers.d/90-{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
        owner: root
        group: root
        validate: 'visudo -cf %s'

    - name: Configura a chave SSH para acesso sem senha ao novo usuário
      authorized_key:
        user: "{{ admin_user }}"
        state: present
        key: "{{ ssh_public_key }}"

    - name: Aplica template de configuração segura para o SSHd
      template:
        src: "{{ playbook_dir }}/vps-templates-base/sshd_config.j2"
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: '0600'
        validate: 'sshd -t -f %s'
      notify: Reiniciar SSH

    - name: Garante que o serviço Fail2Ban está ativo e habilitado
      service:
        name: fail2ban
        state: started
        enabled: yes

    - name: Configura o Firewall (UFW) para negar tudo por padrão
      community.general.ufw:
        state: enabled
        policy: deny

    - name: Libera a nova porta SSH e as portas do K8s no Firewall
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ new_ssh_port }}"
        - "80"
        - "443"
        - "{{ clusterPort }}"

    ###################################################################
    # O restante do seu playbook original continua aqui
    ###################################################################
    - name: Instala a biblioteca Python do Kubernetes via apt (para contornar PEP 668)
      apt:
        name: python3-kubernetes
        state: present

    - name: Habilita e inicia serviço Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Instala Docker Compose (binário oficial)
      get_url:
        url: "https://github.com/docker/compose/releases/latest/download/docker-compose-{{ ansible_system|lower }}-{{ ansible_architecture }}"
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Define MOTD personalizado
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/motd"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'

    - name: Configura ~/.bashrc personalizado (root)
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/bashrc"
        dest: /root/.bashrc
        owner: root
        group: root
        mode: '0644'

    - name: Seleciona binário do KIND de acordo com a arquitetura
      set_fact:
        kind_download_url: >-
          https://kind.sigs.k8s.io/dl/{{ kind_version }}/{{ (kind_binary_x86_64 if ansible_architecture == 'x86_64' else kind_binary_arm64) }}

    - name: Baixa binário do KIND
      get_url:
        url: "{{ kind_download_url }}"
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: Exibe versão do KIND
      command: kind version
      register: kind_version_out
      ignore_errors: true

    - name: Debug - Versão do KIND
      debug:
        msg: "Versão do KIND: {{ kind_version_out.stdout | default('Não foi possível obter') }}"

    - name: Garante que o diretório de chaves apt exista
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Baixa a chave GPG do repositório K8s
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc

    - name: Configura repositório do Kubernetes
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /"
        state: present

    - name: Instala kubectl
      apt:
        name: kubectl
        state: present
        update_cache: yes

    - name: Exibe versão do kubectl (cliente)
      command: kubectl version --client
      register: kubectl_version_out
      ignore_errors: true

    - name: Debug - Versão do kubectl
      debug:
        msg: "kubectl: {{ kubectl_version_out.stdout | default('Não foi possível obter') }}"

    - name: Verifica se já existe algum cluster KIND
      command: kind get clusters
      register: clusters_list
      changed_when: false
      ignore_errors: true

    - name: Copia o kind-config.yaml para a VPS
      copy:
        src: "{{ playbook_dir }}/vps-templates-base/kind-config.yaml"
        dest: /root/kind-config.yaml
        owner: root
        group: root
        mode: '0644'

    - name: Cria o cluster KIND com portas 80, 443 e 6443->42885 (se não existir)
      command: kind create cluster --config=/root/kind-config.yaml
      when: "'kind' not in clusters_list.stdout"

    - name: Instala Ingress NGINX no KIND
      command: kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml

    - name: Aguarda o namespace ingress-nginx existir
      shell: kubectl get ns ingress-nginx
      register: ingress_ns_check
      retries: 10
      delay: 10
      until: ingress_ns_check.rc == 0

    - name: Aguarda o Ingress NGINX ficar pronto
      command: >
        kubectl rollout status deployment/ingress-nginx-controller
        --namespace=ingress-nginx --timeout=5m
      changed_when: false

#    ###################################################################
#    # Passo 6: Instalação do Helm (Temporariamente desativado)
#    ###################################################################
#    - name: Baixa a chave GPG do repositório Helm
#      get_url:
#        url: https://baltocdn.com/helm/signing.asc
#        dest: /etc/apt/keyrings/helm.asc
#        mode: '0644'
#
#    - name: Adiciona repositório do Helm
#      apt_repository:
#        repo: "deb [signed-by=/etc/apt/keyrings/helm.asc] https://baltocdn.com/helm/stable/debian/ all main"
#        state: present
#
#    - name: Instala Helm
#      apt:
#        name: helm
#        state: present

    - name: Verifica versão do Helm
      command: helm version
      register: helm_version_output
      ignore_errors: true

    - name: Debug - Versão do Helm
      debug:
        msg: "Helm instalado: {{ helm_version_output.stdout | default('Não foi possível obter a versão') }}"

    - name: Garante que a pasta /root/helm-charts existe no servidor
      file:
        path: /root/helm-charts
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Baixa kubeseal v0.29.0 tar.gz
      get_url:
        url: https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.29.0/kubeseal-0.29.0-linux-amd64.tar.gz
        dest: /tmp/kubeseal.tar.gz

    - name: Extrai binário kubeseal do tar.gz
      shell: tar -xvzf /tmp/kubeseal.tar.gz kubeseal
      args:
        chdir: /tmp
        creates: /tmp/kubeseal

    - name: Move kubeseal para /usr/local/bin
      copy:
        src: /tmp/kubeseal
        dest: /usr/local/bin/kubeseal
        mode: '0755'
        remote_src: yes

    - name: Verifica versão do kubeseal
      command: kubeseal --version
      register: kubeseal_version_out
      ignore_errors: true

    - name: Debug - Versão do kubeseal
      debug:
        msg: "kubeseal instalado: {{ kubeseal_version_out.stdout | default('Não foi possível obter a versão') }}"

    - name: Baixa manifest oficial do metrics-server
      get_url:
        url: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
        dest: /root/metrics-server.yaml
        mode: '0644'

    - name: Aplica manifest do metrics-server
      community.kubernetes.k8s:
        state: present
        src: /root/metrics-server.yaml

    - name: Verifica se a flag --kubelet-insecure-tls já existe no deployment
      community.kubernetes.k8s_info:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
      register: metrics_server_deployment

    - name: Adiciona flag --kubelet-insecure-tls se não existir (patch)
      community.kubernetes.k8s_json_patch:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        patch:
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --kubelet-insecure-tls
      when: "'--kubelet-insecure-tls' not in metrics_server_deployment.resources[0].spec.template.spec.containers[0].args | default([])"

    - name: Aguarda o rollout do metrics-server
      community.kubernetes.k8s:
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        wait: yes
        wait_timeout: 180
        wait_condition:
          type: Available
          status: "True"

    - name: Exibe status final da configuração
      debug:
        msg: "✅ VPS provisionada, segura e com cluster KIND inicializado com sucesso."

  ###################################################################
  # Handlers: Tarefas que são executadas apenas quando notificadas
  ###################################################################
  handlers:
    - name: Reiniciar SSH
      service:
        name: sshd
        state: restarted