name: 01-Configs VPS + Instalar Cluster KIND

on:
  workflow_dispatch:
    inputs:
      acionar_infra_base:
        description: "⚠️  Executar também o deploy da INFRA BASE? (cert-manager, ArgoCD…)"
        required: true
        default: false
        type: boolean
jobs:
  configure-vps-kind-cluster:
    runs-on: self-hosted

    steps:
    - name: 📦 Checkout repositório
      uses: actions/checkout@v4

    # 1 ▸ Garante as dependências mínimas no runner
    - name: 🔧 Instala dependências (Ansible, SSH)
      run: |
        echo "::group::Instalando dependências"
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends ca-certificates curl git gnupg
        sudo apt-get install -y ansible openssh-client python3-pip
        ansible-galaxy collection install community.kubernetes -vvv
        echo "::endgroup::"

    # 2 ▸ Prepara SSH de forma segura
    - name: 🔐 Configura chave SSH via ssh-agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 🛡️ Adiciona Host conhecido de forma segura
      run: echo "${{ secrets.VPS_HOST_PUBLIC_KEY }}" >> ~/.ssh/known_hosts

    # 3 ▸ Executa playbook KIND
    - name: ⚙️ Playbook Ansible
      working-directory: ./ansible-hostinger
      run: ansible-playbook -i inventory.ini 01-ansible-vps-kind.yaml --extra-vars "ansible_port=${{ secrets.VPS_SSH_PORT }} ansible_user=root"

# 4 ▸ Aciona workflow 02 (infra base) se habilitado
  deploy-infra-base:
    if: ${{ github.event.inputs.acionar_infra_base == 'true' }}
    needs: configure-vps-kind-cluster
    uses: ./.github/workflows/02-infra-base.yaml
    with:
      criar_infra_base: true
    secrets: inherit